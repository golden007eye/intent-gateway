- name: a $20 order is sent
  outbound: {kind: cart, offer: {merchant: shop.example, category: home, price_usd: 20, quantity: 1}}
  expect: {send: true}
- name: a $20.01 order is refused
  outbound: {kind: cart, offer: {merchant: shop.example, category: home, price_usd: 20.01, quantity: 1}}
  expect: {send: false, blocked: [spend.per_order_usd]}
- name: three items at $7 are refused
  outbound: {kind: cart, offer: {merchant: shop.example, category: home, price_usd: 7, quantity: 3}}
  expect: {send: false, blocked: [spend.per_order_usd]}
