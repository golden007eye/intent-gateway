- name: one item is sent
  outbound: {kind: cart, offer: {merchant: shop.example, category: home, price_usd: 20, quantity: 1}}
  expect: {send: true}
- name: two items are refused
  outbound: {kind: cart, offer: {merchant: shop.example, category: home, price_usd: 20, quantity: 2}}
  expect: {send: false, blocked: [quantity.max]}
