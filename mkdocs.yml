# Docs for docs.intentai.shop, built with Material for MkDocs (requirements-docs.txt).
#   python -m venv .venv && .venv/bin/pip install -r requirements-docs.txt && .venv/bin/mkdocs serve
site_name: Docs
site_url: https://docs.intentai.shop/
site_description: Documentation for intent-gateway, the self-hosted gateway that gives AI agents real shopping under a policy the developer controls.
repo_url: https://github.com/golden007eye/intent-gateway
repo_name: intent-gateway
edit_uri: edit/main/docs/
copyright: intent-gateway is licensed under Apache-2.0.
strict: true
# With strict, a link to a missing heading anchor fails the build too.
validation:
  anchors: warn

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/intent-logo-light.svg
  favicon: assets/favicon.svg
  # Fonts are self-hosted (docs/assets/fonts, SIL OFL), so the docs make no request to a font CDN.
  font: false
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Use light theme
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Use dark theme
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Follow system theme
  features:
    - content.code.copy
    - navigation.sections
    - navigation.footer
    - search.highlight

extra:
  # The header logo links back to the main site, not to the docs home.
  homepage: https://intentai.shop
  generator: false

extra_css:
  - stylesheets/intent.css
  - stylesheets/code.css

markdown_extensions:
  - admonition
  - attr_list
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

nav:
  - Overview: index.md
  - Quickstart: quickstart.md
  - Demo mode: demo.md
  - One-tap purchases: one-tap.md
  - Gateway policy: policy.md
  - Policy library: policy-library.md
  - Verify: verify.md
  - Evidence pack: evidence.md
  - The log: log.md
  - Panel: panel.md
  - Threat model: threat-model.md
  - Security: security.md
  - Releasing: release.md
  - Decisions:
      - "ADR-0001: Public-safe harness": adr/0001-harness.md
      - "ADR-0002: TypeScript": adr/0002-typescript.md
      - "ADR-0003: Merge on green": adr/0003-merge-on-green.md
      - "ADR-0004: Public from pre-alpha": adr/0004-public-pre-alpha.md
      - "ADR-0005: npx first, Docker for teams": adr/0005-packaging-npx-docker.md
      - "ADR-0006: Session keys, receipts, key statement": adr/0006-session-keys-receipts.md
      - "ADR-0007: Local store": adr/0007-local-store-jsonl.md
      - "ADR-0008: Public contract copy": adr/0008-public-contract-copy.md
      - "ADR-0009: Policy v1, narrow only": adr/0009-policy-v1-narrow-only.md
      - "ADR-0010: Release supply chain": adr/0010-release-supply-chain.md
      - "ADR-0011: Approver pin": adr/0011-approver-pin.md
      - "ADR-0012: Node support": adr/0012-node-support.md
      - "ADR-0013: Bundled dependencies": adr/0013-bundled-dependencies.md
      - "ADR-0014: Log before send, every destination": adr/0014-log-before-send-every-destination.md
      - "ADR-0015: Outcomes, assurance and binding": adr/0015-outcomes-assurance-binding.md
      - "ADR-0016: Per-approval completer key": adr/0016-per-approval-completer-key.md
      - "ADR-0017: Wallet adapters in the gateway": adr/0017-wallet-adapters-in-the-gateway.md
      - "ADR-0018: Evidence pack": adr/0018-evidence-pack.md
      - "ADR-0019: One-tap completion": adr/0019-one-tap-completion.md
      - "ADR-0020: Signed store pair and storefront check": adr/0020-signed-store-pair-and-storefront-check.md
