# Every PR and every push to main. Third-party actions are pinned by full commit SHA.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.30.1"

jobs:
  node:
    name: node (typecheck, lint, test, boundaries, licence-check)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: node dist/main.js --version
      - run: pnpm test
      - run: pnpm boundaries
      - run: pnpm licence-check
      # The docs site must build with no warning (mkdocs.yml sets strict). The runner's python3, no extra action.
      - name: docs (mkdocs build --strict)
        run: |
          python3 -m venv "$RUNNER_TEMP/docs-venv"
          "$RUNNER_TEMP/docs-venv/bin/pip" install --quiet -r requirements-docs.txt
          "$RUNNER_TEMP/docs-venv/bin/mkdocs" build --strict --site-dir "$RUNNER_TEMP/site"

  # The tests, the build and a packed tarball on every Node line package.json `engines` accepts (F-t). The `node` job
  # above stays the required check on .node-version; this one is not required until the maintainer adds it to the
  # ruleset. pnpm scripts run on the Node 24 that devEngines.runtime pins, so the tests here call vitest with the
  # matrix Node directly, and the one test that runs `npm pack` in the repo (npm refuses a devEngines mismatch) is
  # left to the `node` job.
  node-compat:
    name: node-compat (${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ["22.22.2", "22", "24", "26"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node --version && node dist/main.js --version
      - name: tests on Node ${{ matrix.node }}
        run: node node_modules/vitest/vitest.mjs run --testNamePattern '^(?!.*npm pack --dry-run)'
      # What a developer runs: the packed tarball through npx, with a fresh HOME and npm cache, and no engine warning.
      - name: npx the packed tarball, no EBADENGINE
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/fresh"
          pnpm pack --pack-destination "$RUNNER_TEMP/fresh"
          cd "$RUNNER_TEMP/fresh"
          # ./ so npx reads it as a package, as the README's `npx -y ./intent-gateway-*.tgz` does.
          tgz="$(ls intent-gateway-*.tgz)"
          HOME="$RUNNER_TEMP/fresh" npm_config_cache="$RUNNER_TEMP/fresh/.npm" \
            npx -y "./$tgz" --help > out.txt 2>&1 || { cat out.txt; exit 1; }
          cat out.txt
          if grep -q EBADENGINE out.txt; then echo "::error::npm warned EBADENGINE on Node $(node --version)"; exit 1; fi

  # Below the floor the gateway prints one line naming the supported lines and exits 1 before it loads anything else.
  # 22.17.1 is a Node a developer reported (F-t).
  node-floor:
    name: node-floor (22.17.1 gets one line and exit 1)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.17.1"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: one line, exit 1
        run: |
          set -uo pipefail
          node dist/main.js --help > out.txt 2> err.txt
          code=$?
          cat out.txt err.txt
          [[ "$code" == 1 ]] || { echo "::error::exit $code, not 1"; exit 1; }
          [[ ! -s out.txt ]] || { echo "::error::stdout is not empty"; exit 1; }
          [[ "$(wc -l < err.txt)" == 1 ]] || { echo "::error::stderr is not one line"; exit 1; }
          grep -qF "intent-gateway needs Node 22 LTS (22.22.2 or later), 24 LTS (24.15 or later) or 26+; this is Node 22.17.1." err.txt

  security:
    name: security (gitleaks, public-safety)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: gitleaks (full history, checksum-verified binary)
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfLO "${base}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          ./gitleaks git --no-banner --redact --exit-code 1 .
      # Scans every blob in history, because the history is public. Fork and Dependabot PRs cannot read the
      # secret, so they skip with a notice; the push to main after merge scans the merged history.
      # Everywhere else a missing secret fails the job.
      - name: public-safety (no private terms anywhere in history)
        if: ${{ !(github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]')) }}
        run: node scripts/public-safety.ts --history
        env:
          PRIVATE_TERMS: ${{ secrets.PRIVATE_TERMS }}
      - name: public-safety skipped (secret not available to this PR)
        if: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]') }}
        run: echo "::notice::public-safety runs on main after merge; fork and Dependabot PRs cannot read the term list"

  # The npm package and the Docker image from the same commit (G24, ADR-0005, ADR-0010). Not a required check
  # until the maintainer adds it to the ruleset.
  package:
    name: package (npm tarball, reproducible image, image smoke)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # BUILD_COMMIT vouches for the files in the image build context, so the checkout must be exactly that commit.
      - name: checkout is clean
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=all)" || { git status --porcelain --untracked-files=all; exit 1; }
          echo "BUILD_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - run: npm pack --dry-run --ignore-scripts
      - run: npm publish --dry-run --ignore-scripts --tag next
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # One BuildKit for every build that must give the published digest (package, image, rebuild): an unpinned
          # builder could change between the image and rebuild jobs and change the layers it writes.
          driver-opts: image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      # Three builds from scratch must give one digest. When they do not, image-diff.sh prints the layers, tar
      # entries and files that differ, so the job log names the cause.
      - name: three image builds give the same digest
        run: |
          set -euo pipefail
          for n in 1 2 3; do
            docker buildx build --no-cache --platform linux/amd64 \
              --build-arg BUILD_COMMIT --build-arg SOURCE_DATE_EPOCH \
              --output "type=oci,dest=${RUNNER_TEMP}/image-$n.tar,rewrite-timestamp=true" .
            tar -xOf "${RUNNER_TEMP}/image-$n.tar" index.json | jq -r '.manifests[0].digest' > "${RUNNER_TEMP}/digest-$n"
          done
          cat "${RUNNER_TEMP}"/digest-[123]
          status=0
          for n in 2 3; do
            cmp "${RUNNER_TEMP}/digest-1" "${RUNNER_TEMP}/digest-$n" ||
              { status=1; scripts/image-diff.sh "${RUNNER_TEMP}/image-1.tar" "${RUNNER_TEMP}/image-$n.tar"; }
          done
          exit "$status"
      - name: load the image
        run: |
          docker buildx build --platform linux/amd64 \
            --build-arg BUILD_COMMIT --build-arg SOURCE_DATE_EPOCH \
            --output type=docker,name=intent-gateway:ci,rewrite-timestamp=true .
      - run: node test/image-smoke.ts intent-gateway:ci
