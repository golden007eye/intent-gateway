version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    groups:
      actions: {patterns: ["*"]}
  - package-ecosystem: npm
    directory: /
    schedule: {interval: weekly}
    # Matches pnpm-workspace.yaml minimumReleaseAge: a younger version fails `pnpm install`.
    cooldown: {default-days: 7}
    groups:
      js-dev: {dependency-type: development}
    ignore:
      # typescript-eslint 8.x supports TypeScript <6.1 only (peer range).
      - dependency-name: typescript
        versions: [">=6.1.0"]
      # @types/node tracks the runtime major in .node-version; bump both together by hand.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
